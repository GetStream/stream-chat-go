name: build
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    name: 👷 Test & Build
    runs-on: { group: github-public-amd64 }
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        goVer: ['1.23', '1.24', '1.25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.goVer }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goVer }}

      - name: Test via ${{ matrix.goVer }}
        env:
          STREAM_KEY: ${{ vars.STREAM_CHAT_API_KEY }}
          STREAM_SECRET: ${{ secrets.STREAM_CHAT_API_SECRET }}
          STREAM_MULTI_TENANT_KEY: ${{ vars.STREAM_MULTI_TENANT_KEY || secrets.STREAM_MULTI_TENANT_KEY }}
          STREAM_MULTI_TENANT_SECRET: ${{ secrets.STREAM_MULTI_TENANT_SECRET }}
        run: |
          go test -coverprofile cover.out -v -race ./...
          go tool cover -func=cover.out
